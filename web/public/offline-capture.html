<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#13795b" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/planner-icon.svg" />
    <title>Offline Capture · Planner AI</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: #f5f5f0;
        color: #16211e;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(760px, 100%);
        margin: 8vh auto 0;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 38px;
        font-size: 18px;
        font-weight: 700;
      }
      header img {
        width: 30px;
        height: 30px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0;
      }
      .status {
        margin: 8px 0 20px;
        color: #68736d;
        font-size: 13px;
      }
      .editor {
        display: grid;
        gap: 14px;
        border: 1px solid #d9ddd6;
        border-radius: 8px;
        background: #fff;
        padding: 22px;
        box-shadow: 0 12px 32px rgba(22, 33, 30, 0.07);
      }
      textarea {
        width: 100%;
        min-height: 300px;
        border: 0;
        outline: 0;
        resize: vertical;
        color: #16211e;
        font:
          17px/1.65 Arial,
          Helvetica,
          sans-serif;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-top: 1px solid #d9ddd6;
        padding-top: 14px;
      }
      footer span {
        color: #68736d;
        font-size: 12px;
      }
      button {
        min-height: 40px;
        border: 1px solid #13795b;
        border-radius: 6px;
        background: #13795b;
        color: #fff;
        padding: 8px 16px;
        font:
          700 13px Arial,
          Helvetica,
          sans-serif;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #notice {
        min-height: 21px;
        margin: 14px 0 0;
        color: #0d6248;
        font-size: 13px;
      }
      @media (max-width: 540px) {
        body {
          padding: 16px;
        }
        main {
          margin-top: 4vh;
        }
        h1 {
          font-size: 28px;
        }
        .editor {
          padding: 16px;
        }
        footer {
          align-items: stretch;
          flex-direction: column;
        }
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header><img src="/planner-icon.svg" alt="" /> Planner AI</header>
      <h1>What is on your mind?</h1>
      <p class="status">Offline Capture</p>
      <section class="editor">
        <textarea
          id="capture"
          maxlength="60000"
          placeholder="Start with the thought exactly as it arrives..."
        ></textarea>
        <footer>
          <span>Encrypted on this device</span><button id="save" disabled>Save for sync</button>
        </footer>
      </section>
      <p id="notice" role="status"></p>
    </main>
    <script>
      const databaseName = 'planner-ai-capture-queue';
      const keyId = 'capture-key-v1';
      const draftId = 'active-capture';
      const text = document.querySelector('#capture');
      const save = document.querySelector('#save');
      const notice = document.querySelector('#notice');

      function requestResult(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      function transactionDone(transaction) {
        return new Promise((resolve, reject) => {
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error);
          transaction.onabort = () => reject(transaction.error);
        });
      }
      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(databaseName, 1);
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains('captures'))
              database.createObjectStore('captures', { keyPath: 'id' });
            if (!database.objectStoreNames.contains('voice'))
              database.createObjectStore('voice', { keyPath: 'id' });
            if (!database.objectStoreNames.contains('meta')) database.createObjectStore('meta');
            if (!database.objectStoreNames.contains('drafts')) database.createObjectStore('drafts');
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      async function encryptionKey(database) {
        const read = database.transaction('meta', 'readonly');
        const existing = await requestResult(read.objectStore('meta').get(keyId));
        await transactionDone(read);
        if (existing) return existing;
        const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, [
          'encrypt',
          'decrypt',
        ]);
        const write = database.transaction('meta', 'readwrite');
        write.objectStore('meta').put(key, keyId);
        await transactionDone(write);
        return key;
      }
      async function encrypt(key, value) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv },
          key,
          new TextEncoder().encode(value)
        );
        return { iv: Array.from(iv), ciphertext };
      }
      async function saveDraft(value) {
        const database = await openDatabase();
        const key = await encryptionKey(database);
        const transaction = database.transaction('drafts', 'readwrite');
        if (value)
          transaction
            .objectStore('drafts')
            .put(
              {
                text: await encrypt(key, value),
                source: 'typed',
                updatedAt: new Date().toISOString(),
              },
              draftId
            );
        else transaction.objectStore('drafts').delete(draftId);
        await transactionDone(transaction);
        database.close();
      }
      async function loadDraft() {
        const database = await openDatabase();
        const key = await encryptionKey(database);
        const transaction = database.transaction('drafts', 'readonly');
        const stored = await requestResult(transaction.objectStore('drafts').get(draftId));
        await transactionDone(transaction);
        if (stored) {
          const value = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: new Uint8Array(stored.text.iv) },
            key,
            stored.text.ciphertext
          );
          text.value = new TextDecoder().decode(value);
          save.disabled = text.value.trim().length < 3;
        }
        database.close();
      }
      let timer;
      text.addEventListener('input', () => {
        save.disabled = text.value.trim().length < 3;
        clearTimeout(timer);
        timer = setTimeout(
          () =>
            saveDraft(text.value).catch(() => {
              notice.textContent = 'Local storage is unavailable.';
            }),
          300
        );
      });
      save.addEventListener('click', async () => {
        const rawText = text.value;
        if (rawText.trim().length < 3) return;
        save.disabled = true;
        try {
          const database = await openDatabase();
          const key = await encryptionKey(database);
          const now = new Date().toISOString();
          const transaction = database.transaction(['captures', 'drafts'], 'readwrite');
          transaction
            .objectStore('captures')
            .put({
              id: crypto.randomUUID(),
              text: await encrypt(key, rawText),
              source: 'typed',
              createdAt: now,
              attempts: 0,
              nextRetryAt: now,
              lastErrorAt: null,
            });
          transaction.objectStore('drafts').delete(draftId);
          await transactionDone(transaction);
          database.close();
          text.value = '';
          notice.textContent = 'Capture saved for sync.';
        } catch {
          notice.textContent = 'Capture could not be stored on this device.';
        }
      });
      loadDraft().catch(() => {
        notice.textContent = 'Local storage is unavailable.';
      });
    </script>
  </body>
</html>
