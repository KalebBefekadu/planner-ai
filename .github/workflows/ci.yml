name: Planner AI CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: planner-ai-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run build
        env:
          PLANNER_DATA_MODEL: canonical
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-placeholder

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db
      - name: Verify generated Supabase types
        run: |
          npm run types:generate
          test -s src/types/supabase.generated.ts
          npx prettier --write src/types/supabase.generated.ts
          git diff --exit-code -- src/types/supabase.generated.ts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start
      - name: Export local Supabase credentials
        run: |
          eval "$(npx supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      # Every journey, on every pull request, on one browser project.
      #
      # This used to be a --grep list of nine test titles. It failed open: a
      # renamed test silently stopped being selected, a new spec file was
      # never covered until someone remembered to edit the list, and nothing
      # reported that coverage had shrunk. Two MVP-blocking defects reached
      # the integration branch through that gap -- an import report that
      # described a committed Note as "New", and a Notes editor that discarded
      # the last edit when you opened another Note. Both were found by running
      # the suite by hand.
      #
      # The mobile project still runs only after merge, which is the one
      # genuine saving: it doubles the runtime and has never been the project
      # that caught a defect first.
      - name: Run pull request browser suite
        if: github.event_name == 'pull_request'
        run: npm run test:e2e -- --project=chromium
        env:
          PLANNER_DATA_MODEL: canonical
          PLANNER_UI_PREVIEW: enabled
          PLANNER_UI_V2: enabled
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      - name: Run full browser suite after merge
        if: github.event_name == 'push'
        run: npm run test:e2e
        env:
          PLANNER_DATA_MODEL: canonical
          PLANNER_UI_PREVIEW: enabled
          PLANNER_UI_V2: enabled
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
